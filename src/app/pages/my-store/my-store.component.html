<nz-tabset nzLinkRouter>
    @for (tab of map_panel; track tab) {
      <nz-tab >
        <a *nzTabLink nz-tab-link [routerLink]="['.']"   [queryParams]="{ t: code(tab.param) }"  queryParamsHandling="merge">
          <nz-icon [nzType]="tab.icon"  />
          {{ tab.nombre }}
        </a>
        <ng-container  [ngComponentOutlet]="tab.component"></ng-container>
    </nz-tab>
    }
  </nz-tabset>
