<nz-tabset>
    @for (tab of map_panel; track tab) {
      <nz-tab [nzTitle]="titleTemplate">
        <ng-template #titleTemplate>
          <nz-icon [nzType]="tab.icon" />
          {{ tab.nombre }}
        </ng-template>
        <ng-container  [ngComponentOutlet]="tab.component"></ng-container>
    </nz-tab>
    }
  </nz-tabset>
