
<div class="content-header">
    <input type="text" name="search" id="">
    <button>Buscar</button>
    <button [routerLink]="['/myStore/agregarproducto']">Agregar Producto</button>
</div>
<nz-table #basicTable [nzData]="dataSet">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
        @for (data of basicTable.data; track $index) {
            <tr >
                <td>{{data.name}}</td>
                <td>{{data.description}}</td>
                <td>${{data.price}}</td>
                <td>{{data.inStock}}</td>
                <td><img nz-image nzSrc={{url+(data.img)}} height="50px" width="50px" alt=""></td>
                <td>
                    <a>Action 一 {{data.name}}</a>
                </td>
            </tr>
        }
    </tbody>
  </nz-table>
