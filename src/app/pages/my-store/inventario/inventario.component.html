
<div class="content-header">
    <input type="text" name="search" id="">
    <button>Buscar</button>
    <button [routerLink]="['/myStore/agregarproducto']">Agregar Producto</button>
</div>
<nz-table #basicTable [nzData]="dataSet">
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
        @for (data of basicTable.data; track $index) {
            <tr >
                <td>{{data.name}}</td>
                <td>{{data.age}}</td>
                <td>{{data.address}}</td>
                <td>
                    <a>Action 一 {{data.name}}</a>
                </td>
            </tr>
        }
    </tbody>
  </nz-table>
