<nz-modal
[(nzVisible)]="isVisible"
(nzOnCancel)="handleCancel()"
(nzOnOk)="handleOk()"
[nzOkLoading]="isOkLoading"
[nzFooter]="null"
[nzClassName]="'modal-border-radius'"
>
<div *nzModalContent>
    <form nz-form [formGroup]="form" class="login-form" (ngSubmit)="submitForm()">
        <div class="contenido">
            <div class="content-form">
            <h2>Iniciar sesion</h2>
            <nz-form-item>
                <nz-form-control nzErrorTip="Por favor ingrese un usurio!">
                    <nz-input-group style="border-radius: 5px;" nzPrefixIcon="user">
                        <input type="text"  nz-input formControlName="username" placeholder="E-mail o celular" />
                    </nz-input-group>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-control nzErrorTip="Por favor ingrese una contraseña!">
                  <nz-input-group nzPrefixIcon="lock" style="border-radius: 5px;">
                    <input type="password" nz-input formControlName="password" placeholder="Contraseña" />
                  </nz-input-group>
                </nz-form-control>
            </nz-form-item>
            
            <button nz-button class="btn-ingresar" type="submit" [nzType]="'primary'" [nzLoading]="isLoadingLogin">
                <nz-icon nzType="login" nzTheme="outline" />
                Ingresa
            </button>
            @if (messageError !== undefined) {
                <nz-alert nzType="error" style="width: 100%; margin-top: 10px;" nzMessage={{messageError}} nzShowIcon></nz-alert>
            }
        </div>
        <div class="divider-break">
                <h5>
                    ¿No tienes una cuenta?
                </h5>
            </div>
            <button nz-button class="btn-crear" [nzType]="'default'" type="button" (click)="handleCancel()" [routerLink]="['/register']" routerLinkActive="router-link-active" >Crea tu cuenta</button>
        </div>
        </form>
</div>

</nz-modal>
