<div class="product-container">
    @for (item of products; track $index) {
        <app-card-product 
            [id]="item.id"
            [img]="url+item.img"
            [name]="item.name"
            [description]="item.description"
            [price]="item.price"
            [stock]="item.inStock"
        />
    }
</div>
